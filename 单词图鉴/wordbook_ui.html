<script>
// ===== WORD DATA =====
var wordData = [
  { en: "WOOD", zh: "木材", effect: "召唤木质防御物", unlocked: true },
  { en: "STONE", zh: "石头", effect: "召唤石墙防御", unlocked: true },
  { en: "FIRE", zh: "火焰", effect: "召唤火焰效果", unlocked: true },
  { en: "ICE", zh: "冰霜", effect: "冻结敌人行动", unlocked: true },
  { en: "WIND", zh: "疾风", effect: "加速己方单位", unlocked: true },
  { en: "LIGHT", zh: "圣光", effect: "治疗己方建筑", unlocked: true },
  { en: "SHIELD", zh: "护盾", effect: "生成防护屏障", unlocked: false },
  { en: "THORN", zh: "荆棘", effect: "反弹伤害给敌人", unlocked: false },
  { en: "HEAL", zh: "治愈", effect: "恢复建筑血量", unlocked: false },
  { en: "BOLT", zh: "雷电", effect: "召唤闪电攻击", unlocked: false },
  { en: "CURSE", zh: "诅咒", effect: "削弱敌人属性", unlocked: false },
  { en: "RUNE", zh: "符文", effect: "增强符文效果", unlocked: false },
  { en: "BIND", zh: "束缚", effect: "禁锢敌人移动", unlocked: false },
  { en: "WARD", zh: "结界", effect: "创建防御结界", unlocked: false },
  { en: "VOID", zh: "虚空", effect: "吞噬敌人单位", unlocked: false },
  { en: "DAWN", zh: "黎明", effect: "全屏光属性伤害", unlocked: false },
  { en: "GROVE", zh: "树丛", effect: "召唤自然屏障", unlocked: false },
  { en: "FORGE", zh: "锻造", effect: "强化建筑耐久", unlocked: false }
];

var WORDS_PER_PAGE = 6; // 3 per page side
var currentPage = 1;
var totalPages = Math.ceil(wordData.length / WORDS_PER_PAGE);

// ===== RENDER WORD CARDS =====
function createWordCard(word) {
  var card = document.createElement('div');
  card.className = 'word-card' + (word.unlocked ? '' : ' locked');

  var rune = document.createElement('div');
  rune.className = 'word-rune';
  rune.textContent = word.unlocked ? '◆' : '◇';

  var info = document.createElement('div');
  info.className = 'word-info';
  info.innerHTML = '<div class="word-en">' + word.en + '</div>' +
    '<div class="word-zh">' + word.zh + '</div>' +
    '<div class="word-effect">' + word.effect + '</div>';

  var status = document.createElement('div');
  status.className = 'word-status ' + (word.unlocked ? 'unlocked' : 'locked-status');
  status.textContent = word.unlocked ? '已获得' : '未获得';

  card.appendChild(rune);
  card.appendChild(info);
  card.appendChild(status);
  return card;
}

// ===== RENDER PAGE =====
function renderPage() {
  var leftList = document.getElementById('wordListLeft');
  var rightList = document.getElementById('wordListRight');
  leftList.innerHTML = '';
  rightList.innerHTML = '';

  var startIdx = (currentPage - 1) * WORDS_PER_PAGE;
  var endIdx = Math.min(startIdx + WORDS_PER_PAGE, wordData.length);

  for (var i = startIdx; i < endIdx; i++) {
    var targetList = (i - startIdx) < 3 ? leftList : rightList;
    targetList.appendChild(createWordCard(wordData[i]));
  }

  document.getElementById('pageIndicator').textContent = currentPage + ' / ' + totalPages;
  document.getElementById('pageNumLeft').textContent = '— ' + (currentPage * 2 - 1) + ' —';
  document.getElementById('pageNumRight').textContent = '— ' + (currentPage * 2) + ' —';
}

function changePage(delta) {
  var newPage = currentPage + delta;
  if (newPage < 1 || newPage > totalPages) return;
  currentPage = newPage;
  renderPage();
}

// ===== OPEN / CLOSE =====
function openBook() {
  document.getElementById('bookOverlay').classList.add('open');
  currentPage = 1;
  renderPage();
}

function closeBook() {
  document.getElementById('bookOverlay').classList.remove('open');
}

function closeBookOutside(event) {
  if (event.target === document.getElementById('bookOverlay')) {
    closeBook();
  }
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  var overlay = document.getElementById('bookOverlay');
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeBook();
  if (e.key === 'ArrowLeft') changePage(-1);
  if (e.key === 'ArrowRight') changePage(1);
});

// Initial render
renderPage();
</script>
</body>
</html>

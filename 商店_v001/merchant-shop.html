<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动商店</title>
  <link rel="stylesheet" href="css/merchant-shop.css?v=8">
</head>
<body>

  <!-- ==================== 游戏场景 ==================== -->
  <div id="game-scene">

    <!-- 移动商店图片 -->
    <img id="mobile-shop-img"
         src="assets/shop/mobile_shop.png"
         alt="移动商店"
         draggable="false">

    <!-- NPC 容器 -->
    <div id="npc-container">
      <!-- NPC 图片由 MerchantNPC 动态创建 -->
    </div>

    <!-- 交互按钮 -->
    <button id="interact-btn">交互</button>

    <!-- 英雄 -->
    <div id="hero"></div>

    <!-- 操作提示 -->
    <div id="game-hint">方向键移动 · 靠近商人进行交互</div>

    <!-- 商城面板容器 -->
    <div id="shop-panel-container">
      <!-- 商城面板由 ShopPanel 动态创建 -->
    </div>

  </div>

  <!-- ==================== 脚本 ==================== -->
  <script src="js/merchant-data.js?v=8"></script>
  <script src="js/merchant-npc.js?v=8"></script>
  <script src="js/shop-panel.js?v=8"></script>
  <script src="js/shop-manager.js?v=8"></script>

  <script>
    (function() {
      const gameScene = document.getElementById('game-scene');
      const heroEl = document.getElementById('hero');
      const mobileShopEl = document.getElementById('mobile-shop-img');
      const npcContainer = document.getElementById('npc-container');
      const interactBtn = document.getElementById('interact-btn');
      const shopPanelContainer = document.getElementById('shop-panel-container');
      const gameHint = document.getElementById('game-hint');

      const hero = {
        x: GAME_DATA.scene.heroStartX,
        y: GAME_DATA.scene.heroStartY,
        size: GAME_DATA.scene.heroSize,
        speed: GAME_DATA.scene.heroSpeed,
      };

      const keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
        }
      });
      window.addEventListener('keyup', (e) => { keys[e.key] = false; });

      const sceneWidth = gameScene.clientWidth;
      const sceneHeight = gameScene.clientHeight;
      const scaleX = sceneWidth / GAME_DATA.scene.width;
      const scaleY = sceneHeight / GAME_DATA.scene.height;
      const scale = Math.min(scaleX, scaleY);
      function sx(v) { return v * scale; }

      hero.x = sx(GAME_DATA.scene.heroStartX);
      hero.y = sx(GAME_DATA.scene.heroStartY);
      hero.size = sx(GAME_DATA.scene.heroSize);
      hero.speed = sx(GAME_DATA.scene.heroSpeed);
      hero.maxX = sceneWidth;
      hero.maxY = sceneHeight;

      mobileShopEl.style.left = sx(GAME_DATA.scene.npcX - 200) + 'px';
      mobileShopEl.style.top = sx(GAME_DATA.scene.npcY - 250) + 'px';
      mobileShopEl.style.width = sx(GAME_DATA.mobileShop.displayWidth) + 'px';
      mobileShopEl.style.height = 'auto';

      const npcSize = sx(GAME_DATA.scene.npcSize);
      npcContainer.style.left = sx(GAME_DATA.scene.npcX - GAME_DATA.scene.npcSize / 2) + 'px';
      npcContainer.style.top = sx(GAME_DATA.scene.npcY - GAME_DATA.scene.npcSize) + 'px';

      heroEl.style.left = (hero.x - hero.size / 2) + 'px';
      heroEl.style.top = (hero.y - hero.size / 2) + 'px';
      heroEl.style.width = hero.size + 'px';
      heroEl.style.height = hero.size + 'px';

      interactBtn.style.left = sx(GAME_DATA.scene.npcX - 30) + 'px';
      interactBtn.style.top = sx(GAME_DATA.scene.npcY - GAME_DATA.scene.npcSize - 40) + 'px';

      const scaledSceneConfig = {
        npcX: sx(GAME_DATA.scene.npcX),
        npcY: sx(GAME_DATA.scene.npcY),
        npcSize: npcSize,
        heroStartX: hero.x,
        heroStartY: hero.y,
        heroSpeed: hero.speed,
        heroSize: hero.size,
      };

      const scaledNpcConfig = Object.assign({}, GAME_DATA.npc, {
        interactionRange: sx(GAME_DATA.npc.interactionRange),
      });

      const shopManager = new ShopManager({
        npcContainer: npcContainer,
        interactBtn: interactBtn,
        shopPanelContainer: shopPanelContainer,
        getHeroPosition: () => ({ x: hero.x, y: hero.y }),
        npcConfig: scaledNpcConfig,
        sceneConfig: scaledSceneConfig,
      });

      function gameLoop() {
        let moved = false;
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) { hero.x -= hero.speed; moved = true; }
        if (keys['ArrowRight'] || keys['d'] || keys['D']) { hero.x += hero.speed; moved = true; }
        if (keys['ArrowUp'] || keys['w'] || keys['W']) { hero.y -= hero.speed; moved = true; }
        if (keys['ArrowDown'] || keys['s'] || keys['S']) { hero.y += hero.speed; moved = true; }

        hero.x = Math.max(hero.size / 2, Math.min(hero.maxX - hero.size / 2, hero.x));
        hero.y = Math.max(hero.size / 2, Math.min(hero.maxY - hero.size / 2, hero.y));

        heroEl.style.left = (hero.x - hero.size / 2) + 'px';
        heroEl.style.top = (hero.y - hero.size / 2) + 'px';

        if (moved && gameHint.style.opacity !== '0') {
          gameHint.style.transition = 'opacity 0.5s';
          gameHint.style.opacity = '0';
        }

        shopManager.update();
        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    })();
  </script>

</body>
</html>

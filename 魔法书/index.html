<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📖 Caster’s Grimoire — 施法魔典</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--parchment:#f3e3c9;--gold:#c9a84c;--gb:#e8c547;--gd:#8b6914;--mp:#a855f7;--mc:#22d3ee;--td:#2c1810;--tb:#3d2817}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a02 0%,#0a0401 60%,#000 100%);font-family:'Crimson Text',serif;overflow-x:hidden;overflow-y:auto;cursor:default;user-select:none;padding:8px}
#pc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ag{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:fk 5s ease-in-out infinite}
.ag.g1{width:300px;height:300px;background:radial-gradient(circle,rgba(232,197,71,.10)0%,transparent 70%);top:5%;left:5%}
.ag.g2{width:250px;height:250px;background:radial-gradient(circle,rgba(77,201,246,.07)0%,transparent 70%);bottom:5%;right:5%;animation-delay:-2s}
@keyframes fk{0%,100%{opacity:.6;transform:scale(1)}30%{opacity:.9;transform:scale(1.1)}60%{opacity:.5;transform:scale(.92)}}
.mc{position:relative;z-index:1;width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bt{font-family:'Cinzel Decorative',serif;font-size:clamp(.9rem,2vw,1.2rem);color:var(--gold);letter-spacing:.2em;text-align:center;text-shadow:0 0 30px var(--gd);animation:ts 3s ease-in-out infinite}
@keyframes ts{0%,100%{text-shadow:0 0 30px var(--gd)}50%{text-shadow:0 0 50px var(--gb)}}
.top-bar{display:flex;align-items:center;gap:8px;width:100%;max-width:960px;justify-content:center;flex-wrap:wrap}
.ct{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%;flex:1}
.ctb{padding:4px 9px;background:rgba(26,15,8,.75);border:1px solid rgba(201,168,76,.2);color:#9e8b6e;font-family:'Cinzel Decorative',serif;font-size:clamp(.48rem,.9vw,.6rem);cursor:pointer;letter-spacing:.03em;transition:all .3s;border-radius:2px;white-space:nowrap}
.ctb:hover{border-color:var(--gold);color:var(--gold)}
.ctb.on{border-color:var(--gb);color:var(--gb);background:rgba(201,168,76,.1);box-shadow:0 0 12px rgba(201,168,76,.15)}
.ctb .ce{font-size:.85rem;margin-right:1px}
.prog-btn{padding:4px 10px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);color:#a855f7;font-family:'Cinzel Decorative',serif;font-size:clamp(.45rem,.8vw,.55rem);cursor:pointer;letter-spacing:.04em;border-radius:2px;transition:all .3s}
.prog-btn:hover{background:rgba(168,85,247,.2);box-shadow:0 0 12px rgba(168,85,247,.2)}
.bs{width:100%;max-width:960px;perspective:1500px}
.bk{position:relative;width:100%;aspect-ratio:2/1.25;transform-style:preserve-3d;transition:transform .4s ease}
.bk:hover{transform:rotateX(1deg) translateY(-2px)}
.bcv{position:absolute;inset:-6px -8px;background:linear-gradient(165deg,#4a2c17 0%,#2c1810 30%,#1a0f08 60%,#2c1810 100%);border-radius:6px 12px 12px 6px;box-shadow:0 8px 40px rgba(0,0,0,.6);z-index:0}
.bcv::after{content:'';position:absolute;inset:8px;border:1px solid rgba(201,168,76,.1);border-radius:3px 8px 8px 3px;pointer-events:none}
.bsp{position:absolute;left:-12px;top:-6px;width:16px;height:calc(100% + 12px);background:linear-gradient(90deg,#1a0f08,#3b2416 40%,#2c1810 60%,#1a0f08);border-radius:5px 0 0 5px;transform:rotateY(90deg);transform-origin:left center;z-index:0;box-shadow:-3px 0 10px rgba(0,0,0,.4)}
.bp{position:absolute;inset:0;display:flex;z-index:1;border-radius:4px 10px 10px 4px;overflow:hidden;min-height:0}
.pl{flex:1;background:linear-gradient(175deg,#f5e6c8 0%,#f0ddb8 20%,#ecd5a8 50%,#e5ce9e 80%,#ddc696 100%);position:relative;display:flex;flex-direction:column;padding:clamp(6px,1.2vw,10px) clamp(4px,1vw,8px) clamp(6px,1.2vw,10px) clamp(8px,1.5vw,12px);box-shadow:inset 0 0 40px rgba(139,105,20,.03);min-height:0}
.pl::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(270deg,rgba(0,0,0,.06)0%,transparent 100%);pointer-events:none;z-index:5}
.hp{background:linear-gradient(135deg,rgba(168,85,247,.06)0%,rgba(77,201,246,.04)100%);border:1px solid rgba(168,85,247,.2);border-radius:4px;padding:clamp(3px,.8vw,6px) clamp(4px,1vw,8px);margin-bottom:4px}
.hh{display:flex;align-items:center;gap:5px;margin-bottom:2px;padding-bottom:2px;border-bottom:1px solid rgba(168,85,247,.12)}
.ha{font-size:clamp(1rem,2vw,1.4rem);filter:drop-shadow(0 0 4px rgba(168,85,247,.3))}
.hn{font-family:'Cinzel Decorative',serif;font-size:clamp(.55rem,1vw,.7rem);color:#4a1a6b;letter-spacing:.04em}
.ht{font-size:clamp(.4rem,.7vw,.48rem);color:#8b6914;font-style:italic}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:1px 4px}
.hst{display:flex;align-items:center;gap:2px;font-size:clamp(.4rem,.7vw,.48rem)}
.hsi{font-size:clamp(.5rem,.9vw,.6rem);width:10px;text-align:center;flex-shrink:0}
.hsl{color:#5c3d1a;min-width:14px;font-size:clamp(.35rem,.6vw,.42rem)}
.hsv{font-family:'Cinzel Decorative',serif;font-weight:700;color:#3b1808;font-size:clamp(.4rem,.7vw,.48rem)}
.hsb{flex:1;height:2px;background:rgba(139,105,20,.12);border-radius:1px;overflow:hidden;margin-left:1px}
.hsbf{height:100%;border-radius:1px}
.hsbf.e{background:linear-gradient(90deg,#7c3aed,#a855f7)}
.hsbf.h{background:linear-gradient(90deg,#dc2626,#ef4444)}
.lph{text-align:center;margin-bottom:1px;border-bottom:1px solid rgba(201,168,76,.25);padding-bottom:1px}
.lpt{font-family:'Cinzel Decorative',serif;font-size:clamp(.5rem,.9vw,.6rem);color:#3b1808;letter-spacing:.06em}
.lps{font-size:clamp(.38rem,.65vw,.44rem);color:#8b6914;font-style:italic}
.tl{flex:1;display:flex;flex-direction:column;gap:0;overflow-y:auto}
.tl::-webkit-scrollbar{width:2px}
.tl::-webkit-scrollbar-thumb{background:rgba(139,105,20,.15);border-radius:1px}
.ti{display:flex;align-items:center;gap:3px;padding:2px 4px;cursor:pointer;transition:all .25s;border-radius:2px;border-bottom:1px dotted rgba(201,168,76,.08)}
.ti:hover{background:rgba(201,168,76,.07);padding-left:6px}
.ti.on{background:rgba(168,85,247,.06);border-left:2px solid var(--mp);padding-left:5px}
.te{font-size:clamp(.65rem,1.1vw,.8rem);width:18px;text-align:center;flex-shrink:0}
.tif{flex:1;min-width:0}
.tn{font-family:'Cinzel Decorative',serif;font-size:clamp(.4rem,.7vw,.5rem);color:#3b1808;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{font-size:clamp(.35rem,.58vw,.4rem);color:#8b6914;font-style:italic}
.ta{color:#c9a84c;opacity:0;transition:opacity .3s;font-size:.45rem}
.ti:hover .ta,.ti.on .ta{opacity:1}
.toc-prog{margin-top:2px;height:3px;background:rgba(139,105,20,.1);border-radius:1px;overflow:hidden}
.toc-prog-bar{height:100%;background:linear-gradient(90deg,#a855f7,#7c3aed);border-radius:1px;transition:width .4s}
.sp{width:clamp(14px,2.5vw,22px);background:linear-gradient(90deg,#e0c898 0%,#d4b880 15%,#b89860 30%,#907048 50%,#b89860 70%,#d4b880 85%,#e0c898 100%);position:relative;z-index:2;box-shadow:inset 3px 0 8px rgba(0,0,0,.15),inset -3px 0 8px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sdt{width:3px;height:3px;background:rgba(139,105,20,.4);border-radius:50%}
.pr{flex:1;background:linear-gradient(175deg,#f5e6c8 0%,#f0ddb8 20%,#ecd5a8 50%,#e5ce9e 80%,#ddc696 100%);position:relative;display:flex;flex-direction:column;padding:clamp(6px,1.2vw,10px) clamp(8px,1.5vw,12px) clamp(6px,1.2vw,10px) clamp(4px,1vw,8px);min-width:0;min-height:0;overflow:hidden}
.pr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,rgba(0,0,0,.06)0%,transparent 100%);pointer-events:none;z-index:5}
.rph{text-align:center;margin-bottom:2px}
.rpt{font-family:'Cinzel Decorative',serif;font-size:clamp(.55rem,1vw,.72rem);color:#3b1808;letter-spacing:.06em}
.rps{font-size:clamp(.4rem,.65vw,.48rem);color:#8b6914;font-style:italic}
.rps span{color:var(--mp)}
.sw{margin-bottom:3px;display:flex;gap:4px;justify-content:center;align-items:center}
.si{padding:3px 6px;background:rgba(244,228,193,.3);border:1px solid rgba(201,168,76,.25);color:#3b2416;font-family:'Crimson Text',serif;font-size:clamp(.45rem,.7vw,.52rem);border-radius:2px;outline:none;text-align:center;width:clamp(100px,18vw,160px)}
.si::placeholder{color:rgba(139,105,20,.4);font-style:italic}
.si:focus{border-color:var(--gb);box-shadow:0 0 10px rgba(201,168,76,.1)}
.wg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(3px,.5vw,5px);flex:1;min-height:0;align-content:stretch;overflow:hidden}
.wc{border:1px solid rgba(201,168,76,.25);border-radius:4px;padding:clamp(4px,.8vw,8px) clamp(2px,.4vw,4px);background:rgba(244,228,193,.4);cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.3vw,4px);height:100%;min-height:0;position:relative;overflow:hidden}
.wc:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,.15);transform:translateY(-1px)}
.wc.locked{background:rgba(200,190,170,.25);border-color:rgba(150,140,120,.2);filter:grayscale(.5)}
.wc.locked:hover{border-color:var(--mp);box-shadow:0 0 12px rgba(168,85,247,.15);filter:grayscale(.3)}
.wc.unlocked{border-color:rgba(201,168,76,.35)}
.wc.perfect{border-color:rgba(232,197,71,.5);box-shadow:0 0 10px rgba(232,197,71,.15)}
.wc.perfect::before{content:'';position:absolute;inset:-1px;border-radius:5px;background:linear-gradient(135deg,rgba(232,197,71,.3),rgba(168,85,247,.2),rgba(77,201,246,.2));z-index:-1;animation:pg 3s ease-in-out infinite}
@keyframes pg{0%,100%{opacity:.5}50%{opacity:1}}
.we{font-size:clamp(1.1rem,2vw,1.5rem);line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.12));transition:transform .3s}
.wc:hover .we{transform:scale(1.1)}
.wc.locked .we{filter:grayscale(.8) opacity(.4)}
.wn{font-family:'Cinzel Decorative',serif;font-size:clamp(.45rem,.75vw,.55rem);color:#3b1808;letter-spacing:.02em;text-align:center;line-height:1.1}
.wc.locked .wn{color:#9e8b6e}
.wm{font-size:clamp(.38rem,.6vw,.45rem);color:#7c3aed;font-family:'Cinzel Decorative',serif}
.wt2{font-size:clamp(.35rem,.5vw,.4rem);color:#8b6914}
.wc.locked .wt2,.wc.locked .wm{opacity:.4}
.stars{font-size:clamp(.5rem,.8vw,.6rem);letter-spacing:1px;line-height:1}
.lock-icon{position:absolute;top:3px;right:3px;font-size:clamp(.55rem,.9vw,.7rem);opacity:.7}
.pn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px}
.pnb{background:none;border:1px solid rgba(201,168,76,.25);color:var(--gold);padding:2px 8px;font-family:'Cinzel Decorative',serif;font-size:clamp(.42rem,.7vw,.48rem);cursor:pointer;transition:all .3s;border-radius:2px}
.pnb:hover:not(:disabled){border-color:var(--gb);color:var(--gb)}
.pnb:disabled{opacity:.3;cursor:not-allowed}
.pni{font-family:'Cinzel Decorative',serif;font-size:clamp(.4rem,.65vw,.45rem);color:var(--gd)}

/* ═══ CHALLENGE MODAL ═══ */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;animation:moi .25s ease-out;padding:10px}
@keyframes moi{from{opacity:0}to{opacity:1}}
.md{background:linear-gradient(170deg,#f5e6c8 0%,#f0ddb8 30%,#e8d3a8 70%,#ddc696 100%);border:2px solid rgba(201,168,76,.4);border-radius:8px;padding:clamp(14px,3vw,22px);max-width:520px;width:95%;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:mdp .3s ease-out}
@keyframes mdp{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.md::-webkit-scrollbar{width:3px}
.md::-webkit-scrollbar-thumb{background:rgba(139,105,20,.2);border-radius:2px}
.mclose{position:absolute;top:8px;right:12px;background:none;border:none;color:#8b6914;font-size:1.4rem;cursor:pointer;transition:all .3s;line-height:1;z-index:10}
.mclose:hover{color:#dc2626;transform:scale(1.2)}

.ch-head{text-align:center;margin-bottom:12px}
.ch-emoji{font-size:2.5rem;line-height:1}
.ch-word{font-family:'Cinzel Decorative',serif;font-size:1.2rem;color:#3b1808;letter-spacing:.06em;margin:4px 0}
.ch-zh{font-size:.9rem;font-weight:700;color:#6b21a8}
.ch-info{font-size:.6rem;color:#8b6914;margin:2px 0}

.ch-progress{display:flex;align-items:center;justify-content:center;gap:0;margin:10px 0}
.ch-step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;border:2px solid rgba(201,168,76,.3);background:rgba(244,228,193,.3);color:#8b6914;transition:all .4s}
.ch-step.active{border-color:var(--mp);background:rgba(168,85,247,.15);color:#7c3aed;box-shadow:0 0 10px rgba(168,85,247,.2);animation:stepPulse 1.5s ease-in-out infinite}
.ch-step.done{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
@keyframes stepPulse{0%,100%{box-shadow:0 0 8px rgba(168,85,247,.2)}50%{box-shadow:0 0 16px rgba(168,85,247,.5)}}
.ch-line{width:24px;height:2px;background:rgba(201,168,76,.2)}
.ch-line.done{background:#22c55e}

.ch-stage{text-align:center;padding:8px 0}
.ch-stage-title{font-family:'Cinzel Decorative',serif;font-size:.8rem;color:#3b1808;letter-spacing:.04em;margin-bottom:8px}
.ch-desc{font-size:.6rem;color:#8b6914;margin-bottom:10px;font-style:italic}

.play-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:rgba(168,85,247,.1);border:2px solid rgba(168,85,247,.35);color:#7c3aed;font-family:'Cinzel Decorative',serif;font-size:.8rem;cursor:pointer;border-radius:25px;transition:all .3s;letter-spacing:.04em;margin:6px}
.play-btn:hover{background:rgba(168,85,247,.2);box-shadow:0 0 16px rgba(168,85,247,.2)}
.play-btn.playing{animation:plPulse .6s ease-in-out infinite}
@keyframes plPulse{0%,100%{box-shadow:0 0 8px rgba(168,85,247,.2)}50%{box-shadow:0 0 20px rgba(168,85,247,.6)}}
.record-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:rgba(220,38,38,.1);border:2px solid rgba(220,38,38,.35);color:#dc2626;font-family:'Cinzel Decorative',serif;font-size:.8rem;cursor:pointer;border-radius:25px;transition:all .3s;letter-spacing:.04em;margin:6px}
.record-btn:hover{background:rgba(220,38,38,.15)}
.record-btn.recording{animation:recPulse .8s ease-in-out infinite;background:rgba(220,38,38,.2)}
@keyframes recPulse{0%,100%{box-shadow:0 0 8px rgba(220,38,38,.3)}50%{box-shadow:0 0 24px rgba(220,38,38,.7)}}
.match-result{padding:8px;border-radius:6px;margin:6px 0;font-size:.7rem;font-weight:700}
.match-result.good{background:rgba(34,197,94,.1);color:#22c55e}
.match-result.ok{background:rgba(234,179,8,.1);color:#ca8a04}
.match-result.bad{background:rgba(220,38,38,.1);color:#dc2626}

.spell-input{width:100%;max-width:280px;padding:10px 14px;font-size:1.1rem;text-align:center;font-family:'Cinzel Decorative',serif;letter-spacing:.15em;background:rgba(244,228,193,.4);border:2px solid rgba(201,168,76,.3);border-radius:6px;outline:none;color:#3b1808;transition:all .3s}
.spell-input:focus{border-color:var(--mp);box-shadow:0 0 10px rgba(168,85,247,.15)}
.spell-hint{font-size:.6rem;color:#8b6914;margin-top:4px}
.spell-feedback{min-height:20px;font-size:.65rem;margin-top:4px;font-weight:700}
.spell-feedback.correct{color:#22c55e}
.spell-feedback.wrong{color:#dc2626}
.spell-errors{font-size:.55rem;color:#8b6914;margin-top:2px}
.skip-btn{background:none;border:none;color:#8b6914;font-size:.55rem;cursor:pointer;margin-top:6px;text-decoration:underline;opacity:.6;transition:opacity .3s}
.skip-btn:hover{opacity:1}

.quiz-options{display:flex;flex-direction:column;gap:6px;max-width:320px;margin:0 auto}
.quiz-opt{padding:10px 14px;background:rgba(244,228,193,.3);border:2px solid rgba(201,168,76,.2);border-radius:6px;cursor:pointer;transition:all .3s;text-align:left;font-size:.75rem;color:#3b1808;letter-spacing:.03em}
.quiz-opt:hover{border-color:var(--gold);background:rgba(244,228,193,.5)}
.quiz-opt.correct{border-color:#22c55e!important;background:rgba(34,197,94,.15)!important;color:#22c55e!important;animation:qz .3s ease}
.quiz-opt.wrong{border-color:#dc2626!important;background:rgba(220,38,38,.1)!important;color:#dc2626!important;animation:qz .3s ease}
@keyframes qz{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.quiz-opt .opt-letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:rgba(201,168,76,.15);margin-right:8px;font-weight:700;font-size:.65rem}

.ch-result{text-align:center;padding:10px 0}
.ch-result-emoji{font-size:3rem}
.ch-result-title{font-family:'Cinzel Decorative',serif;font-size:1rem;color:#3b1808;margin:6px 0}
.ch-result-stars{font-size:2rem;letter-spacing:4px;margin:6px 0}
.ch-result-btn{padding:10px 24px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);color:#7c3aed;font-family:'Cinzel Decorative',serif;font-size:.7rem;cursor:pointer;border-radius:4px;letter-spacing:.06em;transition:all .3s;margin-top:8px}
.ch-result-btn:hover{background:rgba(168,85,247,.2);box-shadow:0 0 14px rgba(168,85,247,.2)}

.detail-content{text-align:center}
.d-emoji{font-size:3rem;line-height:1}
.d-en{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#3b1808;letter-spacing:.06em;margin:4px 0}
.d-zh{font-size:1.1rem;font-weight:700;color:#6b21a8}
.d-stars{font-size:1.4rem;letter-spacing:3px;margin:4px 0}
.d-tags{display:flex;gap:6px;justify-content:center;margin:4px 0;flex-wrap:wrap}
.d-tag{padding:2px 8px;border-radius:8px;font-size:.6rem;font-weight:700}
.d-tag.pos{background:rgba(168,85,247,.1);color:#7c3aed}
.d-tag.type{background:rgba(34,197,94,.1);color:#16a34a}
.d-tag.cost{background:rgba(124,58,237,.1);color:#7c3aed}
.ds{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;padding:8px;background:rgba(244,228,193,.3);border-radius:6px;margin:8px 0;border:1px solid rgba(201,168,76,.15)}
.dst{text-align:center}
.dstv{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:.75rem}
.dstv.c{color:#7c3aed}.dstv.h{color:#dc2626}.dstv.a{color:#ea580c}.dstv.s{color:#0891b2}.dstv.r{color:#ca8a04}.dstv.sp{color:#6b21a8;font-size:.65rem}
.dstl{font-size:.48rem;color:#8b6914}
.mph{font-size:.58rem;color:#2c1810;padding:2px 0 2px 8px;border-left:2px solid rgba(168,85,247,.2);margin:2px 0;text-align:left}
.mse{font-size:.58rem;color:#3b1808;padding:2px 8px;margin:2px 0;font-style:italic;background:rgba(168,85,247,.04);border-radius:3px;line-height:1.25;text-align:left}
.msh{font-family:'Cinzel Decorative',serif;font-size:.65rem;color:#3b1808;margin:8px 0 3px;text-align:left;letter-spacing:.03em}

let campaignOrderSignature='';

function campaignAction(word){
  return gameState.campaignActions.find(action=>action.english.toLowerCase()===word.en.toLowerCase());
}
function findWordInfo(english){
  for(const cat of Object.keys(V_DATA)){
    const idx=V_DATA[cat].words.findIndex(word=>word.en.toLowerCase()===english.toLowerCase());
    if(idx>=0)return{cat,idx,w:V_DATA[cat].words[idx]};
  }
  return null;
}
function prioritizeCampaignWords(){
  const signature=gameState.campaignActions.map(action=>`${action.english}:${action.availableFromDay||1}`).join('|');
  if(signature===campaignOrderSignature)return;
  campaignOrderSignature=signature;
  const order=new Map(gameState.campaignActions.map((action,index)=>[action.english.toLowerCase(),index]));
  for(const cat of Object.keys(V_DATA)){
    V_DATA[cat].words.sort((left,right)=>{
      const leftAction=gameState.campaignActions.find(action=>action.english.toLowerCase()===left.en.toLowerCase());
      const rightAction=gameState.campaignActions.find(action=>action.english.toLowerCase()===right.en.toLowerCase());
      if(Boolean(leftAction)!==Boolean(rightAction))return leftAction?-1:1;
      if(leftAction&&rightAction){
        const dayDiff=(leftAction.availableFromDay||1)-(rightAction.availableFromDay||1);
        if(dayDiff!==0)return dayDiff;
        return (order.get(left.en.toLowerCase())||0)-(order.get(right.en.toLowerCase())||0);
      }
      return (left.__originalOrder||0)-(right.__originalOrder||0);
    });
  }
}
function dailyQuotaFull(info){
  return !isUnlocked(info.cat,info.idx)&&gameState.dailyLessonsLearned>=gameState.dailyLessonLimit;
}
function renderLearningQuota(){
  const quota=document.getElementById('learning-quota');
  if(!quota)return;
  const full=gameState.dailyLessonsLearned>=gameState.dailyLessonLimit;
  quota.classList.toggle('full',full);
  quota.textContent=`今日学习 ${gameState.dailyLessonsLearned}/${gameState.dailyLessonLimit}`;
}
function renderStarterCourse(){
  const holder=document.getElementById('starter-course');
  if(!holder)return;
  const required=gameState.requiredStarter||[];
  const buttons=required.map(english=>{
    const info=findWordInfo(english);
    if(!info)return'';
    const learned=isUnlocked(info.cat,info.idx);
    const unavailable=(!gameState.daylight||dailyQuotaFull(info))&&!learned;
    return `<button class="starter-word${learned?' learned':''}" onclick="openStarterLesson('${esc(english)}')" ${unavailable?'disabled':''}>${learned?'✓ ':''}${esc(info.w.en)}<span>${esc(info.w.zh)} · ${learned?'已完成':dailyQuotaFull(info)?'今日名额已满':'点击学习'}</span></button>`;
  }).join('');
  const status=gameState.prepTimerStarted
    ?'必修完成 · 防守准备计时已启动'
    :`完成 ${gameState.starterLessonsCompleted||0}/${gameState.starterLessonsTotal||required.length} 后才会开始首日计时`;
  holder.innerHTML=`<strong>首日必修</strong><small>${status}</small>${buttons}`;
}

function canStudy(info){
  if(!gameState.daylight){stm('☾ 夜晚无法学习 · 先守住这一轮进攻');return false}
  const action=campaignAction(info.w);

function commitLearnedWord(info,stars){

function renderLearnAccepted(info,stars,review=false){

    <button class="ch-result-btn" onclick="closeModals();sc(curCat)">返回魔典</button>
  </div>`;

function requestLearnCommit(info,stars){
  const alreadyLearned=isUnlocked(info.cat,info.idx);
  if(window.parent===window){
    commitLearnedWord(info,stars);
    renderLearnAccepted(info,stars,alreadyLearned);
    return;
  }
  const requestId=nextLearnRequestId();
  pendingLearnRequests.set(requestId,{info,stars,alreadyLearned});
  renderLearnPending(info,stars);
  window.parent.postMessage({
    type:'WORD_CASTER_CODEX_LEARN_REQUEST',
    requestId,
    english:info.w.en,
    stars,
    newlyLearned:!alreadyLearned
  },bridgeOrigin);
}
addEventListener('message',event=>{
  if(location.protocol!=='file:'&&event.origin!==location.origin)return;
  if(event.data?.type==='WORD_CASTER_CODEX_LEARN_RESULT'){
    const pending=pendingLearnRequests.get(event.data.requestId);
    if(!pending)return;
    pendingLearnRequests.delete(event.data.requestId);
    gameState.dailyLessonsLearned=Math.max(0,Number(event.data.dailyLessonsLearned)||gameState.dailyLessonsLearned);
    if(event.data.accepted){
      commitLearnedWord(pending.info,pending.stars);
      renderLearnAccepted(pending.info,pending.stars,pending.alreadyLearned);
      stm(pending.alreadyLearned?'📖 复习完成 · 不占今日名额':'✨ 新词已写入施法魔典');
    }else{
      renderLearnRejected(pending.info,event.data.reason);
      stm(`📕 ${event.data.reason||'当前无法学习'}`);
    }
    return;
  }
  if(event.data?.type!=='WORD_CASTER_CODEX_STATE'&&event.data?.type!=='DUSKWOOD_CODEX_STATE')return;
  gameState={
    daylight:Boolean(event.data.daylight),
    waveIndex:Number(event.data.waveIndex)||0,
    currentDay:Math.max(1,Number(event.data.currentDay)||Number(event.data.waveIndex)+1||1),
    unlockedTier:Number(event.data.unlockedTier)||0,
    campaignActions:Array.isArray(event.data.campaignActions)?event.data.campaignActions:[],
    requiredStarter:Array.isArray(event.data.requiredStarter)?event.data.requiredStarter:['Tower','Archer','Barricade'],
    starterLessonsCompleted:Number(event.data.starterLessonsCompleted)||0,
    starterLessonsTotal:Number(event.data.starterLessonsTotal)||3,
    prepTimerStarted:Boolean(event.data.prepTimerStarted),
    learningLockedReason:event.data.learningLockedReason||null,
    dailyLessonsLearned:Math.max(0,Number(event.data.dailyLessonsLearned)||0),
    dailyLessonLimit:Math.max(1,Number(event.data.dailyLessonLimit)||8),
    dailyLearnedWordKeys:Array.isArray(event.data.dailyLearnedWordKeys)?event.data.dailyLearnedWordKeys:[]
  };
  prioritizeCampaignWords();
  const clock=document.getElementById('game-clock');
  clock.classList.toggle('night',!gameState.daylight);
  clock.textContent=gameState.daylight
    ?`☀ 第${gameState.waveIndex+1}个白昼 · 可以学习`
    :`☾ 第${gameState.waveIndex+1}夜 · 学习封印`;
  for(const action of gameState.campaignActions){
    for(const cat of Object.keys(V_DATA)){
      const idx=V_DATA[cat].words.findIndex(word=>word.en.toLowerCase()===action.english.toLowerCase());
      if(idx<0)continue;
      delete progress[wk(cat,idx)];
      if(action.learned>0)progress[wk(cat,idx)]={stars:Math.max(1,action.learned),date:Date.now()};
    }
  }
  saveProgress();
  renderLearningQuota();
  rcd();
  renderStarterCourse();
});

const LS_KEY='summoning_codex_progress_v3';
let progress={};
try{const s=localStorage.getItem(LS_KEY);if(s)progress=JSON.parse(s)}catch(e){progress={}}
function saveProgress(){try{localStorage.setItem(LS_KEY,JSON.stringify(progress))}catch(e){}}
function wk(cat,idx){const word=V_DATA[cat]?.words?.[idx];return cat+'_'+String(word?.en??idx).toLowerCase()}
function isUnlocked(cat,idx){
  const word=V_DATA[cat]?.words?.[idx],action=word?campaignAction(word):null;
  if(action)return action.learned>0&&!!progress[wk(cat,idx)];
  return!!progress[wk(cat,idx)]
}
function getStars(cat,idx){const k=progress[wk(cat,idx)];return k?k.stars:0}
function catProgress(cat){const w=V_DATA[cat].words;let u=0,ts=0;for(let i=0;i<w.length;i++){if(isUnlocked(cat,i)){u++;ts+=getStars(cat,i)}}return{unlocked:u,total:w.length,totalStars:ts}}
function totalProgress(){let u=0,t=0,ts=0;for(const c of CATS){const p=catProgress(c);u+=p.unlocked;t+=p.total;ts+=p.totalStars}return{unlocked:u,total:t,totalStars:ts}}

      const quotaLocked=!unlocked&&!future&&gameState.dailyLessonsLearned>=gameState.dailyLessonLimit;

      const starStr=unlocked?(stars>=3?'⭐⭐⭐':stars>=2?'⭐⭐':stars>=1?'⭐':''):'';

// ═══ STAGE 1: 听音识词 (Recognition) ═══
function renderStage1Challenge(){
  const w=cs.info.w;
  cs.stage1Tries=0;cs.stage1MaxTries=2;
  // Generate 3 wrong options from same category with similar emoji style
  const catWords=V_DATA[curCat].words.filter(x=>x.en!==w.en);
  const wrongs=[];
  // Pick random wrong answers
  const shuffled=[...catWords].sort(()=>Math.random()-.5);
  for(const x of shuffled){if(wrongs.length<3&&!wrongs.find(o=>o.en===x.en))wrongs.push(x)}
  // If not enough in category, get from others
  if(wrongs.length<3){
    for(const ck of CATS){if(ck===curCat)continue;
      for(const x of V_DATA[ck].words){if(wrongs.length>=3)break;if(!wrongs.find(o=>o.en===x.en)&&x.en!==w.en)wrongs.push(x)}
    }
  }
  cs.stage1Options=[w,...wrongs.slice(0,3)].sort(()=>Math.random()-.5);
  cs.stage1Correct=w;
  cs.stage1Done=false;
  
  let h=`<button class="mclose" onclick="closeModals()">✕</button>`;
  h+=`<div class="ch-head"><div class="ch-emoji">🎧</div><div class="ch-word">第1关：听音识词</div><div class="ch-info">听发音，选出正确的单词 · 可听2次</div></div>`;
  h+=`<div class="ch-progress"><div class="ch-step active">1</div><div class="ch-line"></div><div class="ch-step">2</div><div class="ch-line"></div><div class="ch-step">3</div></div>`;
  h+=`<div class="ch-stage">
    <button class="play-btn" id="play-btn" onclick="playWord('${esc(w.en)}')">🔊 播放发音</button>
    <div id="listen-remaining" style="font-size:.55rem;color:#8b6914;margin:4px 0">剩余播放次数：${cs.stage1MaxTries}</div>
    <div style="font-size:.7rem;color:#3b1808;margin:8px 0">哪个是 "${w.zh}" 的英文？</div>
    <div class="quiz-options">`;
  const letters=['A','B','C','D'];
  cs.stage1Options.forEach((o,i)=>{
    h+=`<div class="quiz-opt" onclick="answerStage1('${esc(o.en)}',${i},this)"><span class="opt-letter">${letters[i]}</span>${o.en} <span style="font-size:.5rem;color:#8b6914">${o.zh}</span></div>`;
  });
  h+=`</div><div id="s1-result" style="margin-top:8px;font-size:.65rem;min-height:20px"></div></div>`;
  document.getElementById('md').innerHTML=h;
}

let s1PlayCount=0;
function playWord(word){
  if(cs?.stage===1){
    s1PlayCount++;if(s1PlayCount>cs.stage1MaxTries){const left=document.getElementById('listen-remaining');if(left)left.textContent='⚠️ 播放次数已用完';return}
    const left=document.getElementById('listen-remaining');if(left)left.textContent=`剩余播放次数：${cs.stage1MaxTries-s1PlayCount}`;
  }
  const btn=document.getElementById('play-btn');if(btn){btn.classList.add('playing');setTimeout(()=>btn.classList.remove('playing'),600)}
  if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.85;u.pitch=1;speechSynthesis.cancel();speechSynthesis.speak(u)}
}

function answerStage1(ans,idx,el){
  if(cs.stage1Done)return;cs.stage1Done=true;s1PlayCount=0;
  document.querySelectorAll('.quiz-opt').forEach(o=>{if(o.textContent.includes(cs.stage1Correct.en))o.classList.add('correct');});
  const r=document.getElementById('s1-result');
  if(ans===cs.stage1Correct.en){
    r.innerHTML='<span style="color:#22c55e;font-weight:700">✅ 正确！听音辨词能力很好！</span>';
    cs.correctCount++;
  }else{
    r.innerHTML=`<span style="color:#dc2626;font-weight:700">❌ 正确答案是：${cs.stage1Correct.en}（${cs.stage1Correct.zh}）</span>`;
    cs.totalStars=Math.max(0,cs.totalStars-1);
    el.classList.add('wrong');
  }
  setTimeout(()=>{cs.stage=2;renderStage2Challenge()},1200);
}

    <div style="font-size:.7rem;color:#3b1808;margin:4px 0">${w.e}</div>
    <div id="s2-hint-area" style="font-size:.6rem;color:#8b6914;min-height:18px;margin:4px 0"></div>
    <input type="text" class="spell-input" id="spell-inp" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkSpelling2()">
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
      <button class="play-btn" style="font-size:.6rem;padding:5px 12px" onclick="checkSpelling2()">提交</button>
      <button class="play-btn" style="font-size:.6rem;padding:5px 12px;background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.3);color:#ca8a04" onclick="useSpellHint()">💡 提示</button>
      <button class="play-btn" style="font-size:.6rem;padding:5px 12px" onclick="playWord('${esc(w.en)}')">🔊 听发音</button>
    </div>
    <div class="spell-feedback" id="spell-fb2"></div>
    <div class="spell-errors" id="spell-errs2">剩余尝试次数：${cs.stage2MaxTries}</div>
  </div>`;
  document.getElementById('md').innerHTML=h;
  setTimeout(()=>{const inp=document.getElementById('spell-inp');if(inp)inp.focus()},200);
}

function useSpellHint(){
  const w=cs.info.w;cs.stage2Hints=(cs.stage2Hints||0)+1;
  const area=document.getElementById('s2-hint-area');
  if(cs.stage2Hints===1){area.textContent=`💡 首字母：${w.en[0]}，共${w.en.length}个字母`}
  else if(cs.stage2Hints===2){area.textContent=`💡 ${w.en[0]}${'_'.repeat(w.en.length-2)}${w.en[w.en.length-1]} (${w.en.length}字母)`}
  else{area.textContent=`💡 完整提示：${w.en}`;cs.totalStars=Math.max(0,cs.totalStars-1)}
}

function checkSpelling2(){
  if(cs.stage2Done)return;
  const inp=document.getElementById('spell-inp');if(!inp)return;
  const ans=inp.value.trim(),w=cs.info.w;
  const fb=document.getElementById('spell-fb2');
  if(!ans){inp.focus();return}
  cs.stage2Tries=(cs.stage2Tries||0)+1;
  
  if(ans.toLowerCase()===w.en.toLowerCase()){
    fb.className='spell-feedback correct';fb.textContent='✅ 拼写正确！记忆很牢固！';
    cs.stage2Done=true;cs.correctCount++;
    setTimeout(()=>{cs.stage=3;renderStage3Challenge()},700);
  }else{
    // Show which letters are correct
    let feedback='';
    const maxLen=Math.max(ans.length,w.en.length);
    for(let i=0;i<maxLen;i++){
      if(i<ans.length&&i<w.en.length&&ans[i].toLowerCase()===w.en[i].toLowerCase())feedback+=ans[i];
      else feedback+=i<w.en.length?'_':'';
    }
    const remaining=cs.stage2MaxTries-cs.stage2Tries;
    fb.className='spell-feedback wrong';
    fb.innerHTML=`❌ 不正确<br><span style="font-size:.55rem">你的输入：${ans}<br>正确对比：${w.en}<br>匹配部分：${feedback}</span>`;
    if(remaining<=0){
      cs.totalStars=Math.max(0,cs.totalStars-1);cs.stage2Done=true;
      setTimeout(()=>{cs.stage=3;renderStage3Challenge()},1500);
    }else{
      document.getElementById('spell-errs2').textContent=`剩余尝试次数：${remaining}`;
      inp.value='';inp.focus();
    }
  }
}

// ═══ STAGE 3: 场景应用 (Application) ═══
function renderStage3Challenge(){
  const w=cs.info.w;
  cs.stage3Done=false;

  // Build natural sentences from the word's own data
  const sentences=[];
  for(const s of(w.se||[])){
    const blanked=s.replace(new RegExp(w.en,'gi'),'_______');
    if(blanked.includes('_______'))sentences.push(blanked);
  }
  if(sentences.length===0) sentences.push(`The best choice for this situation is a _______.`);

  const sentence=sentences[Math.floor(Math.random()*sentences.length)];
  cs.stage3Answer=w.en;

  const dists=genDist(w);
  const opts=[w.en,...dists].sort(()=>Math.random()-.5);
  cs.stage3Opts=opts;cs.stage3Correct=w.en;

  const letters=['A','B','C','D'];
  let h=`<button class="mclose" onclick="closeModals()">✕</button>`;
  h+=`<div class="ch-head"><div class="ch-emoji">🎮</div><div class="ch-word">第3关：场景应用</div><div class="ch-info">在塔防场景中选择正确的单词填入空白</div></div>`;
  h+=`<div class="ch-progress"><div class="ch-step done">✓</div><div class="ch-line done"></div><div class="ch-step done">✓</div><div class="ch-line done"></div><div class="ch-step active">3</div></div>`;
  h+=`<div class="ch-stage">
    <div style="font-size:.82rem;color:#3b1808;margin:8px 0;line-height:1.5;padding:14px;background:rgba(244,228,193,.35);border-radius:6px;border-left:3px solid var(--mp)">
      <span style="font-size:.55rem;color:#8b6914;display:block;margin-bottom:4px">💬 塔防场景对话</span>
      "${sentence}"</div>
    <div style="font-size:.65rem;color:#6b21a8;margin:8px 0">空白处应填入：</div>
    <div class="quiz-options">`;
  opts.forEach((o,i)=>{
    h+=`<div class="quiz-opt" onclick="answerStage3('${esc(o)}',this)"><span class="opt-letter">${letters[i]}</span>${o}</div>`;
  });
  h+=`</div><div id="s3-result" style="margin-top:8px;font-size:.65rem;min-height:20px"></div></div>`;
  document.getElementById('md').innerHTML=h;
}

function answerStage3(ans,el){
  if(cs.stage3Done)return;cs.stage3Done=true;
  document.querySelectorAll('.quiz-opt').forEach(o=>{if(o.textContent.trim().startsWith(cs.stage3Correct))o.classList.add('correct');});
  const r=document.getElementById('s3-result');
  if(ans===cs.stage3Correct){
    r.innerHTML='<span style="color:#22c55e;font-weight:700">✅ 正确！你已经能在实际场景中运用这个词了！</span>';
    cs.correctCount++;
  }else{
    r.innerHTML=`<span style="color:#dc2626;font-weight:700">❌ 正确答案：${cs.stage3Correct}</span>`;
    cs.totalStars=Math.max(0,cs.totalStars-1);
    el.classList.add('wrong');
  }
  setTimeout(()=>{cs.stage=4;renderResult()},1200);
}

function genDist(w){
  const d=[];
  const cw=V_DATA[curCat].words.filter(x=>x.en!==w.en);
  if(cw.length>0)d.push(cw[Math.floor(Math.random()*cw.length)].en);
  const oc=CATS.filter(c=>c!==curCat);
  if(oc.length>0){const rcw=V_DATA[oc[Math.floor(Math.random()*oc.length)]].words;d.push(rcw[Math.floor(Math.random()*rcw.length)].en)}
  d.push(w.en.substring(0,Math.max(1,w.en.length-2))+'ed');
  return d.slice(0,3);
}

function renderResult(){
  const stars=cs.totalStars,info=cs.info;
  requestLearnCommit(info,stars);
}

function reviewWord(){
  cs={info:cs.info,stage:0,seenWord:true,totalStars:3,hintsUsed:0,correctCount:0};
  renderLearn();document.getElementById('mo').style.display='flex';
}

function closeModals(){document.getElementById('mo').style.display='none';document.getElementById('pm').style.display='none';cs=null;rcd();rtl();rt();renderStarterCourse()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});

function showProgress(){
  const tp=totalProgress();let items='';
  for(const cat of CATS){const c=V_DATA[cat],p=catProgress(cat),pct=Math.round(p.unlocked/p.total*100);
    items+=`<div class="pm-item"><span class="em">${c.emoji}</span><span class="nm">${c.title}</span><span class="cnt">${p.unlocked}/${p.total}</span><div class="pm-bar"><div class="pm-bar-fill" style="width:${pct}%"></div></div></div>`;}
  document.getElementById('pmc').innerHTML=`<button class="mclose" onclick="closeModals()">✕</button><div class="pmh">📊 学习进度</div><div class="pm-stat">总计：${tp.unlocked}/${tp.total} 已解锁 · ⭐ ${tp.totalStars} 星</div><div class="pm-list">${items}</div><button class="ch-result-btn" style="display:block;margin:10px auto 0" onclick="resetProgress()">🔄 重置全部进度</button>`;
  document.getElementById('pm').style.display='flex';
}

function resetProgress(){if(confirm('确定重置？不可撤销！')){progress={};saveProgress();if(window.parent!==window)window.parent.postMessage({type:'WORD_CASTER_CODEX_RESET'},bridgeOrigin);closeModals();sc(curCat);stm('🔄 进度已重置')}}

function sc(cat){curCat=cat;curPage=0;sq='';document.getElementById('si').value='';document.querySelectorAll('.ctb').forEach(t=>t.classList.remove('on'));const tab=document.querySelector(`[data-cat="${cat}"]`);if(tab)tab.classList.add('on');rtl();rcd();stm(`📜 ${V_DATA[cat].emoji} ${V_DATA[cat].title}`)}
function stm(msg){const ex=document.querySelector('.mt');if(ex)ex.remove();const t=document.createElement('div');t.className='mt';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function spark(el){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<8;i++){const s=document.createElement('div');s.className='cfs';s.textContent=['✨','💫','⭐','🔮'][Math.floor(Math.random()*4)];s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--sx',`${(Math.random()-.5)*100}px`);s.style.setProperty('--sy',`${(Math.random()-.5)*80-20}px`);document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}

document.getElementById('ct').addEventListener('click',e=>{const tab=e.target.closest('.ctb');if(!tab)return;const cat=tab.dataset.cat;if(cat!==curCat)sc(cat)});
document.getElementById('si').addEventListener('input',e=>{sq=e.target.value;curPage=0;rcd()});
document.getElementById('pp').addEventListener('click',()=>{if(curPage>0){curPage--;rcd()}});
document.getElementById('pn2').addEventListener('click',()=>{const cd=V_DATA[curCat],tp=Math.ceil(cd.words.length/PER_PAGE);if(curPage<tp-1){curPage++;rcd()}});

let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=tx-e.changedTouches[0].clientX;if(Math.abs(dx)>50){const cd=V_DATA[curCat],tp=Math.ceil(cd.words.length/PER_PAGE);if(dx>0&&curPage<tp-1){curPage++;rcd()}else if(dx<0&&curPage>0){curPage--;rcd()}}});

(function spawn(){const r=['✦','✧','⬡','☉','☽','☆','◈','⬠','⏣','◆','⚔️','🛡️','🔮','💀'];const d=document.createElement('div');d.className='fr';d.textContent=r[Math.floor(Math.random()*r.length)];d.style.left=Math.random()*90+'%';d.style.bottom='-30px';d.style.animationDuration=(Math.random()*10+8)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),22000);setTimeout(spawn,3500)})();

rtl();rcd();renderStarterCourse();
if(window.parent!==window){
  window.parent.postMessage({type:'WORD_CASTER_CODEX_READY'},bridgeOrigin);
}
</script>
</body>
